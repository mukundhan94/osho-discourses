name: Suggest a link
description: A place to listen to, watch or read a series
labels: [links]
body:
  - type: markdown
    attributes:
      value: |
        Links must be free to open. No shops, paid memberships or downloads that need payment.
  - type: input
    id: series
    attributes:
      label: Which series?
      placeholder: "Beyond Psychology"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of link is it?
      options: [Listen, Watch, Read]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: The link
      placeholder: "https://"
    validations:
      required: true
  - type: input
    id: label
    attributes:
      label: What should the button say?
      placeholder: "Watch on Internet Archive"
