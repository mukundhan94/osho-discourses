name: Build

# Vercel publishes the site from main. This workflow only checks that every
# push and pull request still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: python3 scripts/build.py
